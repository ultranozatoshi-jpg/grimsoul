
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダメージ計算ツール</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f3f4f6;
        }

        .container {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 18px;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            font-size: 18px;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result {
            margin-top: 24px;
            text-align: center;
        }

        #damage {
            margin-top: 8px;
            font-size: 36px;
            font-weight: bold;
            color: #dc2626;
        }

        #error {
            margin-top: 12px;
            color: #dc2626;
        }

        /* 使い方 */
        .usage {
            margin-top: 30px;
            padding: 16px;
            background-color: #f3f4f6;
            border-radius: 8px;
        }

        .usage h2 {
            font-size: 20px;
            margin-top: 0;
        }

        .usage li {
            margin-bottom: 10px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ダメージ計算ツール</h1>

        <label for="defense">防御力</label>
        <input
            type="number"
            id="defense"
            min="0"
            step="any"
            value="40"
            placeholder="防御力を入力"
        >

        <label for="attack">攻撃力</label>
        <input
            type="number"
            id="attack"
            min="0"
            step="any"
            value="1000"
            placeholder="攻撃力を入力"
        >

        <button type="button" id="calculate">
            ダメージを計算
        </button>

        <div class="result">
            <div>受けるダメージ</div>
            <div id="damage">805</div>
            <div id="error" role="alert"></div>
        </div>

        <!-- 使い方 -->
        <div class="usage">
            <h2>使い方</h2>
            <ul>
                <li>攻撃力と防御力は、表をもとに入力してください。</li>
                <li>物理攻撃と属性攻撃は計算式が同じですので、それぞれ2回入力して計算してください。</li>
            </ul>
        </div>
    </div>

    <script>
        "use strict";

        // 固定定数
        const CONSTANT = 165;

        // ダメージ計算
        function calculateDamage() {
            const defenseInput =
                document.getElementById("defense");

            const attackInput =
                document.getElementById("attack");

            const damageOutput =
                document.getElementById("damage");

            const errorOutput =
                document.getElementById("error");

            const defenseText = defenseInput.value.trim();
            const attackText = attackInput.value.trim();

            // 入力チェック
            if (defenseText === "" || attackText === "") {
                damageOutput.textContent = "-";
                errorOutput.textContent =
                    "防御力と攻撃力を入力してください。";
                return;
            }

            const defense = Number(defenseText);
            const attack = Number(attackText);

            if (
                !Number.isFinite(defense) ||
                !Number.isFinite(attack) ||
                defense < 0 ||
                attack < 0
            ) {
                damageOutput.textContent = "-";
                errorOutput.textContent =
                    "0以上の数値を入力してください。";
                return;
            }

            // 計算式：
            // ROUND((165 / (165 + 防御力)) * 攻撃力, 0)
            const rawDamage =
                (CONSTANT / (CONSTANT + defense)) * attack;

            // 四捨五入して整数にする
            const damage = Math.floor(rawDamage + 0.5);

            // 結果表示
            damageOutput.textContent =
                damage.toLocaleString("ja-JP");

            errorOutput.textContent = "";
        }

        // ボタンを押して計算
        document
            .getElementById("calculate")
            .addEventListener("click", calculateDamage);

        // Enterキーでも計算
        document.querySelectorAll("input").forEach((input) => {
            input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    calculateDamage();
                }
            });
        });

        // 初期表示時に計算
        calculateDamage();
    </script>
</body>
</html>
